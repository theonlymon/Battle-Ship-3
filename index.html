<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ship Battle 3 - Capture the Flag</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&display=swap">
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<style>
:root{--ink:#f6ecc8;--gold:#f0c660;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#0b3b52;color:var(--ink);font-family:"Pirata One",Georgia,serif;overflow:hidden;touch-action:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
#panel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:rgba(4,18,28,.85)}
#panel div{max-width:500px}
h1{font-size:52px;margin:0 0 4px;font-weight:400;color:var(--gold)}
p{margin:0 0 12px;font-family:system-ui,sans-serif;font-size:14px;line-height:1.4;color:#c4d6c8}
p b{color:var(--gold);font-weight:600}
button{font-family:inherit;font-size:22px;background:var(--gold);color:#2b2208;border:0;border-radius:6px;padding:8px 26px;cursor:pointer;margin:4px}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.mp-box{background:rgba(0,0,0,.4);border:1px solid rgba(240,198,96,.3);border-radius:8px;padding:12px;margin:12px 0}
input[type="text"]{font-family:system-ui,sans-serif;font-size:16px;padding:8px;border-radius:4px;border:1px solid var(--gold);background:#1a2b2e;color:#fff;width:180px;text-align:center}
#fire{position:fixed;right:14px;bottom:76px;width:78px;height:78px;border-radius:50%;font-size:18px;padding:0;opacity:.88;z-index:10}
.hide{display:none!important}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="fire" class="hide">Fire</button>
<div id="panel"><div>
<h1 id="title">Ship Battle 3</h1>
<p id="msg">Sail into the enemy harbor, steal their flag and bring it back to your pier. First fleet to 3 captures wins. Sink enemy ships to stop them.</p>
<div class="mp-box">
  <p style="margin-bottom:6px"><b>Multiplayer:</b> host a game or join a friend.</p>
  <button id="btn-host">Host Online Game</button>
  <div style="margin-top:8px"><input type="text" id="room-input" placeholder="Room code"><button id="btn-join">Join Game</button></div>
  <p id="net-status" style="margin-top:6px;font-size:13px;color:var(--gold)">Click Host or enter a code to connect</p>
</div>
<button id="go">Play Offline vs AI</button>
</div></div>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),panel=document.getElementById('panel'),fireBtn=document.getElementById('fire');
const K=.6,WW=2600,WH=1700,HUD=58,RANGE=470,GAME=300,WIN=3,BS=1.5,rnd=Math.random,SERVER='https://removeClassification.onrender.com';
const COL=['#e0a82e','#2f56b8'],NM=['Gold','Navy'];
let W,H,S,DPR,camX=0,camY=0;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;S=Math.max(.45,(H-HUD)/640)}
addEventListener('resize',resize);resize();

// ---------- Multiplayer ----------
let socket=null,roomCode='',isHost=false,isMP=false,syncT=null;
const ns=document.getElementById('net-status'),setNs=t=>ns.innerHTML=t;
function conn(cb){
 if(typeof io==='undefined')return setNs('Socket.io did not load. Check your internet connection.');
 if(socket)socket.disconnect();
 setNs('Connecting...');
 socket=io(SERVER,{transports:['websocket','polling'],reconnection:false});
 socket.on('connect_error',()=>setNs('Server connection failed. Try again.'));
 socket.on('player-joined',()=>{setNs('Friend joined! Starting...');setTimeout(startMP,800)});
 socket.on('client-input',d=>{const p=ships[3];if(p&&isHost){if(d.inp)p.inp=d.inp;if(d.mt)p.mt=d.mt;if(d.fire)fire(p,d.ang)}});
 socket.on('game-state',st=>{if(isHost||state!=='play')return;ships=st.ships;score=st.score;timeLeft=st.timeLeft;balls=st.balls;flags=st.flags;msgs=st.msgs});
 socket.on('connect',cb);
}
document.getElementById('btn-host').onclick=()=>conn(()=>{
 roomCode=Math.random().toString(36).substring(2,7).toUpperCase();isHost=true;
 socket.emit('host-room',roomCode);
 setNs('Room code: <b style="font-size:18px;color:#fff">'+roomCode+'</b> (waiting for friend...)');
});
document.getElementById('btn-join').onclick=()=>{
 const code=document.getElementById('room-input').value.trim().toUpperCase();
 if(!code)return setNs('Enter a room code first.');
 conn(()=>{roomCode=code;socket.emit('join-room',code,ok=>{if(ok){isHost=false;setNs('Connected! Starting...');setTimeout(startMP,800)}else setNs('Room not found or full.')})});
};
function startMP(){
 isMP=true;NAMES[0]=isHost?'Player 1':'Player 2';NAMES[3]=isHost?'Player 2':'Player 1';
 start();clearInterval(syncT);
 if(isHost)syncT=setInterval(()=>{if(state!=='play')return;
  socket.emit('game-state',roomCode,{timeLeft,score,msgs,
   flags,balls:balls.map(b=>({x:b.x,y:b.y})),
   ships:ships.map(s=>({id:s.id,x:s.x,y:s.y,a:s.a,sp:s.sp,hp:s.hp,ammo:s.ammo,dead:s.dead,resp:s.resp,kills:s.kills,team:s.team,name:s.name,isP:s.isP,hidden:s.hidden,reveal:s.reveal,wob:s.wob,carry:s.carry,trail:[]}))})},50);
 else syncT=setInterval(()=>{if(state!=='play')return;const me=ships[3];
  socket.emit('client-input',roomCode,{inp:{L:keys.a||keys.arrowleft,R:keys.d||keys.arrowright,F:keys.w||keys.arrowup,B:keys.s||keys.arrowdown},mt:{x:mouse.x,y:mouse.y}})},50);
}

// ---------- Terrain ----------
const rad=(is,t)=>Math.max(.55,1+.2*Math.sin(2*t+is.p[0])+.16*Math.sin(3*t+is.p[1])+.1*Math.sin(5*t+is.p[2])+.06*Math.sin(8*t+is.p[3]))*is.R;
const info=(is,x,y)=>{const ux=(x-is.x)/is.ex,uy=(y-is.y)/is.ey,d=Math.hypot(ux,uy),t=Math.atan2(uy,ux),r=rad(is,t);return{ux,uy,d,t,r,edge:(d-r)*(is.ex+is.ey)/2}};

function palm(c,x,y,h,l,sc){
 const tx=x+l*16,ty=y-h;c.lineCap='round';
 c.strokeStyle='#3d2c18';c.lineWidth=5*sc;c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+l*4,y-h*.6,tx,ty);c.stroke();
 c.strokeStyle='#8a6a3e';c.lineWidth=2.4*sc;c.stroke();
 for(let k=0;k<9;k++){const a=k/9*6.283+l,ex=tx+Math.cos(a)*40*sc,ey=ty+Math.sin(a)*19*sc+16*sc;
  for(const[col,w]of[['#1c4a1e',4.2],['#4a9a3c',2]]){c.strokeStyle=col;c.lineWidth=w*sc;c.beginPath();c.moveTo(tx,ty);c.quadraticCurveTo(tx+Math.cos(a)*20*sc,ty-16*sc,ex,ey);c.stroke()}}
 c.fillStyle='#4a3318';c.beginPath();c.arc(tx,ty+3*sc,3.5*sc,0,7);c.fill();
}
function bake(is){
 const bw=Math.ceil(is.R*is.ex*3.4)+60,bh=Math.ceil(is.R*is.ey*K*3.4)+170,cs=document.createElement('canvas');
 cs.width=bw*BS;cs.height=bh*BS;const c=cs.getContext('2d');c.scale(BS,BS);c.translate(bw/2,bh/2-20);
 const pl=(sc,dy)=>{c.beginPath();for(let i=0;i<=72;i++){const t=i/72*6.283,r=rad(is,t)*sc,x=Math.cos(t)*r*is.ex,y=Math.sin(t)*r*is.ey*K+dy;i?c.lineTo(x,y):c.moveTo(x,y)}c.closePath()};
 pl(1.04,4);c.fillStyle='#a8966b';c.fill();
 let g=c.createRadialGradient(-is.R*.3,-is.R*.2,5,0,0,is.R*is.ex*1.5);g.addColorStop(0,'#f0e2b8');g.addColorStop(1,'#cfb985');
 pl(1,3);c.fillStyle=g;c.fill();
 for(const[sc,dy,col]of[[.93,15,'#26221c'],[.93,8,'#4a4338'],[.93,2,'#6f6552']]){pl(sc,dy);c.fillStyle=col;c.fill()}
 g=c.createRadialGradient(-is.R*.3,-is.R*.3*K,5,0,0,is.R*is.ex*1.3);g.addColorStop(0,'#5c9a3a');g.addColorStop(.7,'#356b28');g.addColorStop(1,'#234a1c');
 pl(.87,-6);c.fillStyle=g;c.fill();
 for(let i=0;i<is.R*1.6;i++){const t=rnd()*6.28,d=Math.sqrt(rnd())*.8*rad(is,t);c.fillStyle=rnd()<.5?'rgba(130,175,75,.2)':'rgba(8,38,8,.22)';c.beginPath();c.ellipse(Math.cos(t)*d*is.ex,Math.sin(t)*d*is.ey*K-6,6+rnd()*12,3+rnd()*5,0,0,7);c.fill()}
 for(const k of is.rocks){const x=k.ox,y=k.oy*K+3;c.fillStyle='rgba(0,0,0,.3)';c.beginPath();c.ellipse(x+2,y+k.r*.35,k.r*1.1,k.r*.6,0,0,7);c.fill();
  c.fillStyle='#5a554c';c.beginPath();c.ellipse(x,y,k.r,k.r*.7,0,0,7);c.fill();c.fillStyle='#9a9487';c.beginPath();c.ellipse(x-k.r*.2,y-k.r*.25,k.r*.55,k.r*.33,0,0,7);c.fill()}
 for(const b of is.trees){const x=b.ox,y=b.oy*K-8,r=b.r;
  c.fillStyle='rgba(0,18,0,.35)';c.beginPath();c.ellipse(x+4,y+r*.55,r*1.05,r*.6,0,0,7);c.fill();
  g=c.createRadialGradient(x-r*.35,y-r*.45,1,x,y-r*.1,r*1.1);g.addColorStop(0,b.c);g.addColorStop(1,'#1d4a1f');
  c.fillStyle=g;c.beginPath();c.ellipse(x,y-r*.3,r,r*.85,0,0,7);c.fill()}
 for(const p of is.palms)palm(c,p.ox,p.oy*K-2,p.h,p.l,p.s);
 is.img=cs;is.bw=bw;is.bh=bh;
}
const mkI=(x,y,R,ex,ey)=>{const is={x,y,R,ex,ey,p:[rnd()*6.28,rnd()*6.28,rnd()*6.28,rnd()*6.28]};
 const pt=f=>{const t=rnd()*6.28,d=Math.sqrt(rnd())*f*rad(is,t);return{ox:Math.cos(t)*d*ex,oy:Math.sin(t)*d*ey}},srt=(a,b)=>a.oy-b.oy;
 is.palms=Array.from({length:Math.round(R/14)},()=>({...pt(.74),h:35+rnd()*22,l:rnd()*2-1,s:.8+rnd()*.5})).sort(srt);
 is.trees=Array.from({length:Math.round(R/2)},()=>({...pt(.8),r:10+rnd()*12,c:['#7bb24e','#5f9a3f','#6aa845'][rnd()*3|0]})).sort(srt);
 is.rocks=Array.from({length:Math.round(R/16)},()=>{const t=rnd()*6.28,d=rad(is,t)*(.97+rnd()*.14);return{ox:Math.cos(t)*d*ex,oy:Math.sin(t)*d*ey,r:6+rnd()*9}});
 bake(is);return is};
const islands=[mkI(540,430,190,1.35,.9),mkI(1330,330,170,1.2,1),mkI(2080,520,200,1.1,1.1),mkI(720,1200,210,1.3,.85),mkI(1480,930,160,1,1.2),mkI(2080,1290,190,1.3,.9),mkI(1200,1470,130,1.2,.9),mkI(440,900,105,1,1)];
const gulls=Array.from({length:14},(_,i)=>({i:i%islands.length,a:rnd()*6.28,sp:.3+rnd()*.3,o:1.05+rnd()*.3,h:55+rnd()*30}));
const shadows=Array.from({length:7},()=>({x:rnd()*WW,y:rnd()*WH,r:200+rnd()*200,v:14+rnd()*12}));

// Seamless ocean texture
const tile=(()=>{const t=document.createElement('canvas');t.width=t.height=512;const c=t.getContext('2d');c.fillStyle='#0c4057';c.fillRect(0,0,512,512);
 for(let i=0;i<150;i++){const x=rnd()*512,y=rnd()*512,r=30+rnd()*90,lt=rnd()<.5,c0=lt?'rgba(80,190,200,.13)':'rgba(2,20,40,.16)',c1=lt?'rgba(80,190,200,0)':'rgba(2,20,40,0)';
  for(const dx of[-512,0,512])for(const dy of[-512,0,512]){const g=c.createRadialGradient(x+dx,y+dy,0,x+dx,y+dy,r);g.addColorStop(0,c0);g.addColorStop(1,c1);c.fillStyle=g;c.fillRect(x+dx-r,y+dy-r,r*2,r*2)}}
 return t})();
const pat=ctx.createPattern(tile,'repeat');

// ---------- State ----------
let NAMES=['You','Barnaby','Silveroak','Greatbear','Dockhand','Saltypete'];
const BASEN=NAMES.slice();
let state='ready',ships=[],balls=[],fx=[],flags=[],msgs=[],score=[0,0],timeLeft=GAME,mouse={x:1300,y:850},ms={x:0,y:0},keys={},touch=false,T=0;
const myT=()=>isMP&&!isHost?1:0,note=t=>msgs.push({t,l:3.5});

function mk(team,i,name,isP){const sx=team?WW-160:160,sy=560+i*240;return{team,name,isP,sx,x:sx,y:sy,a:team?Math.PI:0,sp:0,hp:4,ammo:3,rl:0,cd:0,reveal:0,hidden:false,dead:false,resp:0,kills:0,carry:false,role:i===2?'run':'def',aiCd:1+rnd()*1.5,wob:rnd()*6,ra:rnd()*6.28,rd:rnd()<.5?1:-1,pt:0,trail:[],inp:{L:0,R:0,F:0,B:0},mt:null}}
function start(){
 ships=[mk(0,1,NAMES[0],true),mk(0,0,NAMES[1]),mk(0,2,NAMES[2]),mk(1,0,NAMES[3],isMP),mk(1,1,NAMES[4]),mk(1,2,NAMES[5])].map((s,i)=>(s.id=i,s));
 flags=[0,1].map(t=>{const x=t?WW-120:120;return{team:t,hx:x,hy:850,x,y:850,car:-1,d:false,t:0}});
 balls=[];fx=[];msgs=[];score=[0,0];timeLeft=GAME;state='play';panel.classList.add('hide');if(touch)fireBtn.classList.remove('hide');
}
const norm=a=>{while(a>Math.PI)a-=6.283;while(a<-Math.PI)a+=6.283;return a};
const volley=s=>Math.min(5,3+Math.floor(s.kills/2));
const blocked=(x1,y1,x2,y2)=>{for(let i=1;i<10;i++){const x=x1+(x2-x1)*i/10,y=y1+(y2-y1)*i/10;for(const is of islands){const f=info(is,x,y);if(f.d<f.r*.9)return true}}return false};
const spotted=(e,team)=>{const R=e.hidden&&e.reveal<=0?250:760;return ships.some(a=>a.team===team&&!a.dead&&Math.hypot(a.x-e.x,a.y-e.y)<R)};

function fire(s,ang){
 if(s.dead||s.ammo<=0||s.cd>0)return;
 s.ammo--;s.cd=.4;s.reveal=2.5;const n=volley(s);
 for(let i=0;i<n;i++){const a=ang+(i-(n-1)/2)*.15,v=310*(.98+rnd()*.04);balls.push({x:s.x+Math.cos(a)*40,y:s.y+Math.sin(a)*40,vx:Math.cos(a)*v,vy:Math.sin(a)*v,v,d:0,s})}
 for(let i=0;i<9;i++)fx.push({x:s.x+Math.cos(ang)*46,y:s.y+Math.sin(ang)*46,vx:Math.cos(ang)*40+(rnd()-.5)*40,vy:Math.sin(ang)*40+(rnd()-.5)*40,l:.6,m:.6,c:'#e6e6e0',r:7});
}
function splash(x,y,c,n=9){for(let i=0;i<n;i++){const a=rnd()*6.28,v=30+rnd()*70;fx.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.55,m:.55,c:c||'#dff2ee',r:3.5})}}

function ai(s,dt){
 const fl=flags[s.team],ef=flags[1-s.team];let tg=null,bd=1e9,da=s.a,go=0;
 for(const e of ships)if(e.team!==s.team&&!e.dead&&spotted(e,s.team)){const d=Math.hypot(e.x-s.x,e.y-s.y);if(d<bd){bd=d;tg=e}}
 let ob=null;
 if(s.carry)ob={x:fl.hx,y:fl.hy};
 else if(s.role==='run'){const c=ef.car>=0?ships[ef.car]:null;ob=c&&c.team===s.team?{x:c.x,y:c.y}:{x:ef.x,y:ef.y}}
 else if(fl.car>=0){const c=ships[fl.car];ob={x:c.x,y:c.y}}
 else if(fl.d)ob={x:fl.x,y:fl.y};
 s.aiCd-=dt;
 if(tg&&s.aiCd<=0&&bd<450&&!blocked(s.x,s.y,tg.x,tg.y)){const t=bd/310,ax=tg.x+Math.cos(tg.a)*tg.sp*t,ay=tg.y+Math.sin(tg.a)*tg.sp*t;fire(s,Math.atan2(ay-s.y,ax-s.x)+(rnd()-.5)*.2);s.aiCd=1.1+rnd()*1.2}
 if(tg&&bd<420&&(s.role==='def'||!ob)&&!(ob&&s.carry)){da=Math.atan2(tg.y-s.y,tg.x-s.x);go=bd>270?1:.45;if(bd<190)da+=1.3}
 else if(ob){da=Math.atan2(ob.y-s.y,ob.x-s.x);go=.85}
 else{const cx=fl.hx+(s.team?-230:230),wx=cx+Math.cos(s.ra)*170,wy=fl.hy+Math.sin(s.ra)*270;s.pt+=dt;
  if(Math.hypot(wx-s.x,wy-s.y)<90||s.pt>5){s.ra+=s.rd*.5;s.pt=0}
  da=Math.atan2(wy-s.y,wx-s.x);go=.6}
 if(go>0){let rx=0,ry=0;for(const is of islands){const f=info(is,s.x,s.y);if(f.edge<140){const wg=(140-f.edge)/140,m=Math.hypot(s.x-is.x,s.y-is.y),nx=(s.x-is.x)/m,ny=(s.y-is.y)/m;rx+=(nx-ny*s.rd*.8)*wg;ry+=(ny+nx*s.rd*.8)*wg}}
  const w=Math.min(1,Math.hypot(rx,ry));if(w>0){const m=Math.hypot(rx,ry);da=Math.atan2(Math.sin(da)*(1-w)+ry/m*w,Math.cos(da)*(1-w)+rx/m*w)}}
 return{da,go};
}

function updShip(s,dt){
 if(s.dead){s.resp-=dt;if(s.resp<=0){s.dead=false;s.carry=false;s.hp=4;s.ammo=3;s.x=s.sx;s.y=400+rnd()*900;s.a=s.team?Math.PI:0;s.sp=0}return}
 s.cd-=dt;s.reveal-=dt;s.rl+=dt;if(s.ammo<3&&s.rl>1.6){s.ammo++;s.rl=0}
 let da=s.a,go=0,manual=false;
 if(s.isP){
  const loc=!(isMP&&isHost&&s.id===3),inp=loc?{L:keys.a||keys.arrowleft,R:keys.d||keys.arrowright,F:keys.w||keys.arrowup,B:keys.s||keys.arrowdown}:s.inp,mt=loc?mouse:(s.mt||s);
  if(inp.L||inp.R||inp.F||inp.B){manual=true;s.a+=((inp.R?1:0)-(inp.L?1:0))*1.7*dt;go=inp.B&&!inp.F?.2:inp.F?1:.55}
  else{const dx=mt.x-s.x,dy=mt.y-s.y,d=Math.hypot(dx,dy);if(d>60){da=Math.atan2(dy,dx);go=Math.min(1,d/220)}}
 }else{const r=ai(s,dt);da=r.da;go=r.go}
 if(!manual)s.a+=Math.max(-1.6*dt,Math.min(1.6*dt,norm(da-s.a)));
 s.sp+=(go*(s.isP?150:132)*(s.carry?.88:1)-s.sp)*Math.min(1,dt*1.8);
 s.x+=Math.cos(s.a)*s.sp*dt;s.y+=Math.sin(s.a)*s.sp*dt;
 s.hidden=false;
 for(const is of islands){const f=info(is,s.x,s.y);
  if(f.edge<42){const nd=f.r+84/(is.ex+is.ey);s.x=is.x+f.ux/f.d*nd*is.ex;s.y=is.y+f.uy/f.d*nd*is.ey;s.sp*=.75}
  else if(f.edge<190&&s.sp<28)s.hidden=true}
 for(const o of ships)if(o!==s&&!o.dead){const dx=s.x-o.x,dy=s.y-o.y,d=Math.hypot(dx,dy);if(d<70&&d>0){s.x+=dx/d*(70-d)*.5;s.y+=dy/d*(70-d)*.5}}
 s.x=Math.max(60,Math.min(WW-60,s.x));s.y=Math.max(60,Math.min(WH-60,s.y));
 if(s.sp>25&&rnd()<dt*18)s.trail.push({x:s.x-Math.cos(s.a)*46,y:s.y-Math.sin(s.a)*46,l:1});
 s.trail.forEach(p=>p.l-=dt*.8);s.trail=s.trail.filter(p=>p.l>0);
}

const home=f=>{f.car=-1;f.d=false;f.x=f.hx;f.y=f.hy};
function flagsUpd(dt){
 for(const f of flags){
  if(f.car>=0){const c=ships[f.car];if(c.dead||!c.carry){c.carry=false;f.car=-1;f.d=true;f.t=12;note(NM[f.team]+' flag dropped!')}else{f.x=c.x;f.y=c.y}}
  if(f.car<0&&f.d){f.t-=dt;if(f.t<=0){home(f);note(NM[f.team]+' flag returned to base')}}
  if(f.car<0)for(const s of ships){
   if(s.dead||Math.hypot(s.x-f.x,s.y-f.y)>72)continue;
   if(s.team!==f.team){f.car=s.id;f.d=false;s.carry=true;note(NM[s.team]+' took the '+NM[f.team]+' flag!');break}
   if(f.d){home(f);note(NM[f.team]+' flag recovered!');break}
  }
 }
 for(const s of ships)if(s.carry&&!s.dead){const h=flags[s.team];if(Math.hypot(s.x-h.hx,s.y-h.hy)<95){s.carry=false;home(flags[1-s.team]);score[s.team]++;note(NM[s.team]+' captured the flag!  '+score[0]+' - '+score[1])}}
}

function update(dt){
 T+=dt;timeLeft-=dt;msgs.forEach(m=>m.l-=dt);msgs=msgs.filter(m=>m.l>0);
 if(timeLeft<=0||score[0]>=WIN||score[1]>=WIN){timeLeft=Math.max(0,timeLeft);return finish()}
 if(isMP&&!isHost)return;
 ships.forEach(s=>updShip(s,dt));flagsUpd(dt);
 for(const b of balls){
  b.x+=b.vx*dt;b.y+=b.vy*dt;b.d+=b.v*dt;
  for(const s of ships)if(!s.dead&&s.team!==b.s.team&&Math.hypot(s.x-b.x,s.y-b.y)<44){
   b.d=1e9;s.hp--;splash(b.x,b.y,'#ffb347',12);
   if(s.hp<=0){s.dead=true;s.resp=4;b.s.kills++;splash(s.x,s.y,'#444',28);splash(s.x,s.y,'#ff9a3c',20)}
  }
  for(const is of islands){const f=info(is,b.x,b.y);if(f.d<f.r*.9){b.d=1e9;splash(b.x,b.y,'#9a8658')}}
  if(b.d>=RANGE&&b.d<1e8)splash(b.x,b.y);
 }
 balls=balls.filter(b=>b.d<RANGE);
 fx.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt});fx=fx.filter(p=>p.l>0);
}

function finish(){
 if(state==='over')return;state='over';clearInterval(syncT);
 const[a,b]=score;let k=[0,0];ships.forEach(s=>k[s.team]+=s.kills);
 document.getElementById('title').textContent=a+' - '+b;
 const w=a!==b?(a>b?0:1):(k[0]!==k[1]?(k[0]>k[1]?0:1):-1);
 document.getElementById('msg').textContent=w<0?'A drawn battle!':(w===0?'Gold Fleet wins':'Navy Fleet wins')+(a===b?' on ship kills ('+k[0]+' - '+k[1]+')':'')+'.';
 document.getElementById('go').textContent='Play Again';
 fireBtn.classList.add('hide');panel.classList.remove('hide');
}

addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;if(k===' '||k.startsWith('arrow'))e.preventDefault();if(k===' '){state==='play'?shoot():(!isMP&&state!=='ready'&&start())}});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});addEventListener('blur',()=>{keys={}});
document.getElementById('go').onclick=()=>{isMP=false;isHost=false;clearInterval(syncT);if(socket){socket.disconnect();socket=null}NAMES=BASEN.slice();start()};

let last=performance.now();
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;cam(dt);if(state==='play')update(dt);else T+=dt;gulls.forEach(g=>g.a+=g.sp*dt);shadows.forEach(c=>{c.x+=c.v*dt;if(c.x>WW+c.r)c.x=-c.r});draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
</body>
